# Publishes @bctrl/sdk when a GitHub release is published for a tag matching package.json (v3.0.0 for 3.0.0).
# npm trusted publishing authenticates this workflow through GitHub OIDC: no registry token is stored, and the
# package carries provenance. Re-run it from the Actions tab if a publish failed.
name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.4
      # Node 24 ships npm 11, which trusted publishing requires.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Verify the release tag
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run check:package
      - run: npm publish --access public --provenance
